<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftLore · Minecraft Assistant</title>
  <style>
    :root {
      --bg-1: #0d1117;
      --bg-2: #161b22;
      --panel: rgba(22, 27, 34, 0.85);
      --panel-border: #30363d;
      --ink: #e6edf3;
      --muted: #8b949e;
      --green: #5cb85c;
      --green-dark: #2e7d32;
      --gold: #f2c14e;
      --blue: #58a6ff;
      --orange: #ff9f43;
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(92, 184, 92, 0.18), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(88, 166, 255, 0.14), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      line-height: 1.6;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 3rem 1.25rem 2.5rem;
    }

    /* Header with a blocky, Minecraft-style logo */
    .brand { display: flex; align-items: center; gap: 1rem; }
    .logo {
      width: 56px; height: 56px;
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
      border-radius: 6px; overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      border: 2px solid #111;
    }
    .logo span { display: block; }
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    h1 em { font-style: normal; color: var(--green); }
    .tagline { margin: 0.2rem 0 0; color: var(--muted); }

    /* Panels */
    .panel {
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 1.4rem;
      margin-top: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      animation: rise 0.35s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    /* Search */
    form { display: flex; gap: 0.6rem; }
    input {
      flex: 1;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      color: var(--ink);
      background: #0b0f14;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: #6e7681; }
    input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(92, 184, 92, 0.25);
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      color: #fff;
    }
    #send {
      padding: 0.85rem 1.5rem;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      background: linear-gradient(180deg, #6fcf6f, var(--green-dark));
      box-shadow: 0 4px 0 #1b5e20, 0 8px 18px rgba(46, 125, 50, 0.35);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    #send:hover { filter: brightness(1.08); }
    #send:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b5e20; }
    #send:disabled {
      background: #30363d;
      box-shadow: none;
      cursor: default;
      transform: none;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .chip {
      padding: 0.4rem 0.85rem;
      font-size: 0.88rem;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.1);
      color: var(--blue);
      border: 1px solid rgba(88, 166, 255, 0.25);
      transition: background 0.2s;
    }
    .chip:hover { background: rgba(88, 166, 255, 0.2); }

    #status {
      margin-top: 1rem;
      min-height: 1.4rem;
      color: var(--muted);
      font-size: 0.95rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    #status.error { color: var(--red); }
    .dots span {
      display: inline-block;
      width: 7px; height: 7px;
      margin-right: 4px;
      border-radius: 50%;
      background: var(--green);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Answer */
    .hidden { display: none !important; }
    .answer-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
      margin-bottom: 0.9rem;
    }
    .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }
    .badge.lore { background: rgba(88, 166, 255, 0.15); color: var(--blue); }
    .badge.recipe { background: rgba(255, 159, 67, 0.15); color: var(--orange); }
    .badge.warn { background: rgba(255, 107, 107, 0.15); color: var(--red); }
    .copy {
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      background: #21262d;
      color: var(--ink);
      border: 1px solid var(--panel-border);
    }
    .copy:hover { border-color: var(--muted); }
    #answer {
      white-space: pre-wrap;
      font-size: 1.05rem;
      padding: 1rem 1.1rem;
      background: #0b0f14;
      border-left: 4px solid var(--green);
      border-radius: 8px;
    }
    .sources-title {
      margin: 1.4rem 0 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .source {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.65rem 0.8rem;
      margin-bottom: 0.5rem;
      background: #0b0f14;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--blue);
      word-break: break-all;
      font-size: 0.92rem;
      transition: border-color 0.2s, transform 0.15s;
    }
    .source:hover { border-color: var(--blue); transform: translateX(3px); }
    .source .n {
      flex: none;
      width: 26px; height: 26px;
      display: grid; place-items: center;
      border-radius: 6px;
      background: rgba(88, 166, 255, 0.15);
      font-weight: 700;
      font-size: 0.8rem;
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--panel-border);
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      form { flex-direction: column; }
      #send { width: 100%; }
      h1 { font-size: 1.6rem; }
    }
  </style>
  <link rel="stylesheet" href="/static/recipe.css">
  <link rel="stylesheet" href="/static/recipe.css">
</head>
<body>
<main>
  <header class="brand">
    <div class="logo" aria-hidden="true">
      <span style="background:#5b3a1e"></span><span style="background:#6aa84f"></span><span style="background:#6aa84f"></span><span style="background:#5b3a1e"></span>
      <span style="background:#6aa84f"></span><span style="background:#8b5a2b"></span><span style="background:#8b5a2b"></span><span style="background:#6aa84f"></span>
      <span style="background:#8b5a2b"></span><span style="background:#3b2a1a"></span><span style="background:#3b2a1a"></span><span style="background:#8b5a2b"></span>
      <span style="background:#5b3a1e"></span><span style="background:#8b5a2b"></span><span style="background:#8b5a2b"></span><span style="background:#5b3a1e"></span>
    </div>
    <div>
      <h1>Craft<em>Lore</em></h1>
      <p class="tagline">Ask anything about Minecraft Java Edition: lore, mobs, places, and crafting recipes.</p>
    </div>
  </header>

  <section class="panel">
    <form id="ask-form" autocomplete="off">
      <input id="question" type="text" maxlength="500" placeholder="e.g. What do ghasts drop when they die?" required>
      <button id="send" type="submit">Ask</button>
    </form>
    <div class="chips">
      <button type="button" class="chip" data-q="What do I need to craft a beacon?">Beacon recipe</button>
      <button type="button" class="chip" data-q="What do ghasts drop when they die?">Ghast drops</button>
      <button type="button" class="chip" data-q="What is sculk?">What is sculk?</button>
      <button type="button" class="chip" data-q="Where do piglins live?">Piglins</button>
    </div>
    <div id="status"></div>
  </section>

  <section id="recipe" class="panel hidden"></section>
  <section id="recipe" class="panel hidden"></section>
  <section id="result" class="panel hidden">
    <div class="answer-head">
      <div class="badges" id="badges"></div>
      <button type="button" class="copy" id="copy">Copy answer</button>
    </div>
    <div id="answer"></div>
    <div id="sources-wrap" class="hidden">
      <p class="sources-title">Sources</p>
      <div id="sources"></div>
    </div>
  </section>

  <footer>
    Answers use Minecraft Wiki content, licensed CC BY-NC-SA. This is an unofficial fan project and is non-commercial.
    Minecraft is a trademark of Mojang Studios.
  </footer>
</main>

<script>
  const form = document.getElementById("ask-form");
  const input = document.getElementById("question");
  const button = document.getElementById("send");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const answerBox = document.getElementById("answer");
  const badges = document.getElementById("badges");
  const copyBtn = document.getElementById("copy");
  const sourcesWrap = document.getElementById("sources-wrap");
  const sourcesBox = document.getElementById("sources");

  function showStatus(text, isError = false) {
    status.className = isError ? "error" : "";
    status.innerHTML = "";
    if (!isError && text) {
      status.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    }
    const label = document.createElement("span");
    label.textContent = text;
    status.appendChild(label);
  }

  function addBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    badges.appendChild(span);
  }

  async function ask(question) {
    button.disabled = true;
    showStatus("Searching the wiki and writing an answer");
    window.renderRecipe(null);
    window.renderRecipe(null);
    result.classList.add("hidden");
    badges.textContent = "";
    answerBox.textContent = "";
    sourcesBox.textContent = "";
    sourcesWrap.classList.add("hidden");

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || `Request failed (${res.status})`);
      }

      window.renderRecipe(data.recipe);
      window.renderRecipe(data.recipe);
      // textContent, not innerHTML: the answer is never rendered as HTML.
      answerBox.textContent = data.answer;

      if (data.route === "mechanics") addBadge("Recipe lookup", "recipe");
      else addBadge("Wiki lore", "lore");
      if (!data.verified) addBadge("Not fully verified", "warn");

      data.sources.forEach((url, i) => {
        const link = document.createElement("a");
        link.className = "source";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        const num = document.createElement("span");
        num.className = "n";
        num.textContent = i + 1;
        const text = document.createElement("span");
        text.textContent = url;
        link.append(num, text);
        sourcesBox.appendChild(link);
      });
      if (data.sources.length) sourcesWrap.classList.remove("hidden");

      result.classList.remove("hidden");
      showStatus("");
    } catch (err) {
      showStatus(err.message, true);
    } finally {
      button.disabled = false;
    }
  }

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(answerBox.textContent);
      copyBtn.textContent = "Copied";
      setTimeout(() => (copyBtn.textContent = "Copy answer"), 1500);
    } catch {
      copyBtn.textContent = "Copy failed";
    }
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (question) ask(question);
  });

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      input.value = chip.dataset.q;
      ask(chip.dataset.q);
    });
  });
</script>
<script src="/static/recipe.js"></script>
<script src="/static/recipe.js"></script>
</body>
</html>
